[custom]
; 仅使用自定义最小输出：无 [Proxy Group]，并由 base 提供最小 [Rule]
enable_rule_generator=false
overwrite_original_rules=true

; 用一个会被折叠到 [Proxy] 的直连组覆盖本机默认分组，避免输出 [Proxy Group]
custom_proxy_group=DIRECT_ONLY`select`[]DIRECT

; 不使用远程规则集，由 base 中的 FINAL,DIRECT 收口
ruleset=

; 引用已验证的模板版本，避免 GitHub CDN / 转换器缓存返回旧模板
; 更新 base 后，将下方提交号换成新版本；节点订阅仍会正常自动更新
surge_rule_base=https://raw.githubusercontent.com/dev-johnny-gh/clean-surge-config/b73a119038c10727d9c39d62596d1dabb01848db/surge_base_no_group_rule.conf
